openapi: 3.1.0
info:
  title: WebTui Chat Backend API
  version: 0.9.0
  description: Contract nền cho backend WebTui Chat. Tài liệu API được cập nhật theo từng phase backend.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Kiểm tra API còn sống
      responses:
        "200":
          description: API đang hoạt động
  /ready:
    get:
      security: []
      summary: Kiểm tra API sẵn sàng nhận traffic
      responses:
        "200":
          description: API sẵn sàng
  /version:
    get:
      security: []
      summary: Thông tin phiên bản backend
      responses:
        "200":
          description: Thông tin phiên bản
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /desktop/releases/{channel}/{target}/{arch}/{current_version}:
    get:
      security: []
      summary: Manifest signed updater cho desktop app
      description: Tra manifest Tauri updater da publish theo channel/target/arch. Tra 204 khi chua cau hinh hoac chua co ban moi.
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum: [stable, beta]
        - name: target
          in: path
          required: true
          schema:
            type: string
            example: windows-x86_64
        - name: arch
          in: path
          required: true
          schema:
            type: string
            example: x86_64
        - name: current_version
          in: path
          required: true
          schema:
            type: string
            example: 0.1.0
      responses:
        "200":
          description: Manifest co ban cap nhat signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopUpdaterManifest"
        "204":
          description: Khong co ban cap nhat hoac chua cau hinh manifest
  /metrics:
    get:
      security: []
      summary: Metrics Prometheus của API
      description: Bật bằng `METRICS_ENABLED=true`, trả metric kỹ thuật dạng text/plain.
      responses:
        "200":
          description: Metrics Prometheus
          content:
            text/plain:
              schema:
                type: string
  /api/v1:
    get:
      security: []
      summary: Thông tin API v1
      responses:
        "200":
          description: API v1 hoạt động
  /api/v1/ws:
    get:
      summary: Kết nối WebSocket realtime
      description: >-
        Kết nối WebSocket realtime. Client có thể xác thực bằng header
        `Authorization: Bearer {access_token}`, query `access_token={access_token}`
        hoặc browser subprotocol `["webtui.jwt", accessToken]`. Sau khi kết nối,
        client gửi JSON `{"type":"join","room":"workspace:{workspace_id}:channel:{channel_id}"}`
        để nhận event của channel.
      parameters:
        - name: access_token
          in: query
          required: false
          schema:
            type: string
          description: Access token JWT cho browser WebSocket khi không set được header Authorization.
        - name: Sec-WebSocket-Protocol
          in: header
          required: false
          schema:
            type: string
          description: Có thể gửi `webtui.jwt, {access_token}` bằng WebSocket subprotocol.
      responses:
        "101":
          description: Nâng cấp kết nối WebSocket thành công
  /api/v1/auth/register:
    post:
      security: []
      summary: Đăng ký user mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/login:
    post:
      security: []
      summary: Đăng nhập bằng email hoặc username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/google:
    post:
      security: []
      summary: Đăng nhập hoặc đăng ký bằng Google Identity Services
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
      responses:
        "200":
          description: Xác thực Google thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/refresh:
    post:
      security: []
      summary: Rotate refresh token và cấp access token mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh thành công
  /api/v1/auth/logout:
    post:
      security: []
      summary: Thu hồi refresh token hiện tại
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Logout thành công
  /api/v1/auth/me:
    get:
      summary: Lấy user hiện tại từ access token
      responses:
        "200":
          description: Thông tin user hiện tại
  /api/v1/auth/sessions:
    get:
      summary: Danh sách phiên đăng nhập của user hiện tại
      responses:
        "200":
          description: Danh sách phiên
    delete:
      summary: Thu hồi toàn bộ phiên đăng nhập của user hiện tại
      responses:
        "204":
          description: Đã thu hồi
  /api/v1/auth/sessions/{session_id}:
    delete:
      summary: Thu hồi một phiên đăng nhập
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Đã thu hồi
  /api/v1/users/me:
    get:
      summary: Lấy hồ sơ user hiện tại
      responses:
        "200":
          description: Hồ sơ user
    patch:
      summary: Cập nhật hồ sơ user hiện tại
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Hồ sơ đã cập nhật
  /api/v1/users:
    get:
      summary: Danh sách user
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Danh sách user
  /api/v1/users/{user_id}:
    get:
      summary: Xem hồ sơ user theo id
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Hồ sơ user
  /api/v1/rbac/permissions:
    get:
      summary: Danh mục permission hệ thống
      responses:
        "200":
          description: Danh sách permission
  /api/v1/rbac/me:
    get:
      summary: Danh sách permission của user trong workspace
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Danh sách permission của user
  /api/v1/rbac/check:
    get:
      summary: Kiểm tra user có permission trong workspace hay không
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: permission
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Kết quả kiểm tra quyền
  /api/v1/rbac/roles:
    get:
      summary: Danh sách role hệ thống và role của workspace
      parameters:
        - name: workspace_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Danh sách role
    post:
      summary: Tạo role riêng cho workspace
      responses:
        "201":
          description: Tạo role thành công
  /api/v1/rbac/workspaces/{workspace_id}/members/{user_id}/roles:
    get:
      summary: Danh sách role của một thành viên workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Danh sách role
    post:
      summary: Gán role cho thành viên workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Đã gán role
  /api/v1/workspaces:
    get:
      summary: Danh sách workspace của user hiện tại
      responses:
        "200":
          description: Danh sách workspace
    post:
      summary: Tạo workspace mới
      responses:
        "201":
          description: Tạo workspace thành công
  /api/v1/workspaces/{workspace_id}:
    get:
      summary: Xem chi tiết workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Chi tiết workspace
    patch:
      summary: Cập nhật workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Workspace đã cập nhật
    delete:
      summary: Xóa mềm workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "204":
          description: Đã xóa mềm
  /api/v1/workspaces/{workspace_id}/channels/{channel_id}/messages/{message_id}/forward:
    post:
      summary: Chuyển tiếp tin nhắn và file đính kèm sang kênh khác
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            maxLength: 128
          description: Optional client-generated key for retry-safe message sends.
        - $ref: "#/components/parameters/MessageID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_channel_id]
              properties:
                target_channel_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Tin nhắn đã được chuyển tiếp
  /api/v1/workspaces/{workspace_id}/members:
    get:
      summary: Danh sách thành viên workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Danh sách thành viên
    post:
      summary: Thêm thành viên vào workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "201":
          description: Đã thêm thành viên
  /api/v1/workspaces/{workspace_id}/settings/{key}:
    put:
      summary: Tạo hoặc cập nhật setting workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Setting đã cập nhật
  /api/v1/workspaces/{workspace_id}/invites:
    get:
      summary: Danh sách lời mời workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Danh sách lời mời
    post:
      summary: Tạo lời mời workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "201":
          description: Tạo lời mời thành công
  /api/v1/workspaces/{workspace_id}/departments:
    get:
      summary: Danh sách phòng ban
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Danh sách phòng ban
    post:
      summary: Tạo phòng ban
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "201":
          description: Tạo phòng ban thành công
  /api/v1/workspaces/{workspace_id}/departments/{department_id}:
    get:
      summary: Xem chi tiết phòng ban
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/DepartmentID"
      responses:
        "200":
          description: Chi tiết phòng ban
    patch:
      summary: Cập nhật phòng ban
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/DepartmentID"
      responses:
        "200":
          description: Phòng ban đã cập nhật
    delete:
      summary: Xóa mềm phòng ban
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/DepartmentID"
      responses:
        "204":
          description: Đã xóa mềm
  /api/v1/workspaces/{workspace_id}/departments/{department_id}/members:
    get:
      summary: Danh sách thành viên phòng ban
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/DepartmentID"
      responses:
        "200":
          description: Danh sách trưởng phòng và thành viên
    post:
      summary: Thêm thành viên hoặc cập nhật vai trò trong phòng ban
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/DepartmentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role]
              properties:
                user_id:
                  type: string
                  format: uuid
                role:
                  type: string
                  enum: [lead, member]
      responses:
        "201":
          description: Thành viên phòng ban đã được cập nhật
  /api/v1/workspaces/{workspace_id}/departments/{department_id}/members/{user_id}:
    delete:
      summary: Xóa thành viên khỏi phòng ban
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/DepartmentID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Đã xóa thành viên khỏi phòng ban
  /api/v1/workspaces/{workspace_id}/channels:
    get:
      summary: Danh sách kênh
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Danh sách kênh
    post:
      summary: Tạo kênh public hoặc private
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "201":
          description: Tạo kênh thành công
  /api/v1/workspaces/{workspace_id}/channels/{channel_id}:
    get:
      summary: Xem chi tiết kênh
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "200":
          description: Chi tiết kênh
    patch:
      summary: Cập nhật kênh
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "200":
          description: Kênh đã cập nhật
    delete:
      summary: Archive kênh
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "204":
          description: Đã archive
  /api/v1/workspaces/{workspace_id}/channels/{channel_id}/read-state:
    put:
      summary: Cập nhật trạng thái đã đọc của user hiện tại
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "200":
          description: Read state đã cập nhật
  /api/v1/workspaces/{workspace_id}/messages/search:
    get:
      summary: Tìm kiếm tin nhắn bằng PostgreSQL full text search
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: channel_id
          in: query
          schema:
            type: string
            format: uuid
        - name: sender_id
          in: query
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          schema:
            type: string
            enum: [text, file, system, bot, event]
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Danh sách tin nhắn khớp từ khóa
  /api/v1/workspaces/{workspace_id}/channels/{channel_id}/messages:
    get:
      summary: Lấy timeline tin nhắn trong kênh
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
        - name: before
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Timeline tin nhắn
    post:
      summary: Gửi tin nhắn text vào kênh
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Gửi tin nhắn thành công
  /api/v1/workspaces/{workspace_id}/channels/{channel_id}/messages/{message_id}:
    get:
      summary: Xem chi tiết tin nhắn
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
        - $ref: "#/components/parameters/MessageID"
      responses:
        "200":
          description: Chi tiết tin nhắn
    patch:
      summary: Sửa nội dung tin nhắn
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
        - $ref: "#/components/parameters/MessageID"
      responses:
        "200":
          description: Tin nhắn đã cập nhật
    delete:
      summary: Xóa mềm tin nhắn
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
        - $ref: "#/components/parameters/MessageID"
      responses:
        "204":
          description: Đã xóa mềm
  /api/v1/workspaces/{workspace_id}/channels/{channel_id}/messages/{message_id}/thread:
    get:
      summary: Lấy root message và các reply theo thread_root_id
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
        - $ref: "#/components/parameters/MessageID"
      responses:
        "200":
          description: Danh sách tin nhắn trong thread
  /api/v1/workspaces/{workspace_id}/channels/{channel_id}/messages/{message_id}/reactions:
    post:
      summary: Thêm reaction vào tin nhắn
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
        - $ref: "#/components/parameters/MessageID"
      responses:
        "200":
          description: Reaction đã cập nhật
  /api/v1/workspaces/{workspace_id}/channels/{channel_id}/messages/{message_id}/reactions/{emoji}:
    delete:
      summary: Xóa reaction của user hiện tại khỏi tin nhắn
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
        - $ref: "#/components/parameters/MessageID"
        - name: emoji
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reaction đã cập nhật
  /api/v1/workspaces/{workspace_id}/files:
    get:
      summary: Danh sách file trong workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Danh sách file
    post:
      summary: Upload file bằng multipart form
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  type: string
                  description: JSON string tùy chọn.
      responses:
        "201":
          description: Upload file thành công
  /api/v1/workspaces/{workspace_id}/files/{file_id}:
    get:
      summary: Xem metadata file
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Metadata file
  /api/v1/workspaces/{workspace_id}/files/{file_id}/download:
    get:
      summary: Tải nội dung file
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Nội dung file
  /api/v1/workspaces/{workspace_id}/files/{file_id}/versions:
    get:
      summary: Danh sách version của file
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Danh sách version
    post:
      summary: Upload version mới cho file
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/FileID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Tạo version mới thành công
  /api/v1/notifications:
    get:
      summary: Danh sách thông báo của user hiện tại
      parameters:
        - name: workspace_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          notifications:
                            type: array
                            items:
                              $ref: "#/components/schemas/Notification"
