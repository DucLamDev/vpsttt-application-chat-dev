  /api/v1/workspaces/{workspace_id}/cronjobs:
    get:
      summary: Danh sách cronjob hệ thống
      description: Cần quyền `cronjob.manage` trong workspace truyền trên path.
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, paused, disabled]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Danh sách cronjob
    post:
      summary: Tạo cronjob
      description: Runner được allowlist gồm `http`, `builtin_cleanup`, `worker` và `script`.
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCronJobRequest"
      responses:
        "201":
          description: Cronjob đã được tạo
  /api/v1/workspaces/{workspace_id}/cronjobs/{cronjob_id}:
    patch:
      summary: Cập nhật cronjob
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/CronJobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCronJobRequest"
      responses:
        "200":
          description: Cronjob đã được cập nhật
    delete:
      summary: Xóa cronjob
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/CronJobID"
      responses:
        "204":
          description: Đã xóa cronjob
  /api/v1/workspaces/{workspace_id}/cronjobs/{cronjob_id}/runs:
    get:
      summary: Lịch sử chạy cronjob
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/CronJobID"
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Danh sách lần chạy cronjob
  /api/v1/workspaces/{workspace_id}/cronjobs/{cronjob_id}/run:
    post:
      summary: Chạy cronjob thủ công
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/CronJobID"
      responses:
        "201":
          description: Cronjob đã được chạy thủ công và ghi run log
  /api/v1/workspaces/{workspace_id}/admin/stats:
    get:
      summary: Thống kê dashboard quản trị
      description: Cần quyền `admin.view`.
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Thống kê workspace cho admin
  /api/v1/workspaces/{workspace_id}/admin/health:
    get:
      summary: Health check sâu cho admin
      description: Cần quyền `admin.view`, trả trạng thái DB, Redis, RabbitMQ, storage và WebSocket nếu được cấu hình.
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Hệ thống sẵn sàng
        "503":
          description: Một hoặc nhiều dependency chưa sẵn sàng
  /api/v1/workspaces/{workspace_id}/audit-logs:
    get:
      summary: Danh sách audit log
      description: Cần quyền `audit.view`.
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - name: actor_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
        - name: entity_type
          in: query
          schema:
            type: string
        - name: entity_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Audit log đã lọc
  /api/v1/workspaces/{workspace_id}/backup-jobs:
    get:
      summary: Danh sách backup job
      description: Cần quyền `backup.manage`.
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Danh sách backup job
    post:
      summary: Tạo backup job database
      description: MVP hiện hỗ trợ `backup_type=database`.
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBackupJobRequest"
      responses:
        "201":
          description: Backup job đã được tạo
  /api/v1/workspaces/{workspace_id}/backup-jobs/{backup_job_id}/runs:
    get:
      summary: Lịch sử chạy backup job
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/BackupJobID"
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Danh sách backup run
  /api/v1/workspaces/{workspace_id}/backup-jobs/{backup_job_id}/run:
    post:
      summary: Chạy backup job thủ công
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/BackupJobID"
      responses:
        "201":
          description: Backup run đã được tạo
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DepartmentID:
      name: department_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelID:
      name: channel_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageID:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileID:
      name: file_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    APITokenID:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BotID:
      name: bot_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookID:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationID:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CronJobID:
      name: cronjob_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketID:
      name: ticket_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BackupJobID:
      name: backup_job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          description: Dữ liệu trả về
        error:
          $ref: "#/components/schemas/ApiError"
        meta:
          description: Metadata phân trang hoặc thông tin bổ sung
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    VersionInfo:
      type: object
      properties:
        app:
          type: string
        env:
          type: string
        version:
          type: string
        clients:
          type: object
          properties:
            desktop:
              $ref: "#/components/schemas/DesktopVersionPolicy"
    DesktopVersionPolicy:
      type: object
      properties:
        minimum_version:
          type: string
          description: Minimum desktop app version allowed by this backend contract.
        recommended_version:
          type: string
          description: Recommended desktop app version for the current release channel.
        update_url:
          type: string
          format: uri
    DesktopUpdaterManifest:
      type: object
      required: [version, platforms]
      properties:
        version:
          type: string
        notes:
          type: string
        pub_date:
          type: string
          format: date-time
        platforms:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DesktopUpdaterPlatform"
    DesktopUpdaterPlatform:
      type: object
      required: [signature, url]
      properties:
        signature:
          type: string
        url:
          type: string
          format: uri
    SendMessageRequest:
      type: object
      required: [body]
      properties:
        parent_id:
          type: string
          format: uuid
          description: Tin nhắn cha khi reply thread.
        client_message_id:
          type: string
          maxLength: 128
          description: Optional client-generated idempotency key. Also stored in metadata.
        kind:
          type: string
          default: text
        body:
          type: string
        metadata:
          type: object
          additionalProperties: true
        mentioned_user_ids:
          type: array
          items:
            type: string
            format: uuid
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
        thread_root_id:
          type: string
          format: uuid
        kind:
          type: string
        body:
          type: string
        metadata:
          type: object
          additionalProperties: true
        mentions:
          type: array
          items:
            type: string
            format: uuid
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/ReactionSummary"
        created_at:
          type: string
          format: date-time
    ReactionSummary:
      type: object
      properties:
        emoji:
          type: string
        count:
          type: integer
        reacted_by_me:
          type: boolean
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        body:
          type: string
        data:
          type: object
          additionalProperties: true
        read_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    NotificationPreference:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [all, mentions, muted]
        preview:
          type: boolean
        quiet_hours:
          type: boolean
        quiet_start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        quiet_end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NotificationPreferenceRequest:
      type: object
      required: [workspace_id, mode, preview, quiet_hours, quiet_start, quiet_end]
      properties:
        workspace_id:
          type: string
          format: uuid
        mode:
