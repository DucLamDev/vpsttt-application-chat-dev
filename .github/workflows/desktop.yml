name: Desktop

on:
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "frontend/**"
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - ".github/workflows/desktop.yml"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-web:
    name: Desktop web contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm run test:unit

      - name: Build desktop static export
        run: npm --workspace @webtui/web run build:desktop

      - name: Upload desktop static export
        uses: actions/upload-artifact@v4
        with:
          name: desktop-web-out
          path: frontend/apps/web/out
          if-no-files-found: error

  desktop-native:
    name: Native desktop (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    needs: desktop-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact_path: frontend/apps/desktop/src-tauri/target/release/bundle/nsis/**
          - os: macos-latest
            bundle: dmg
            artifact_path: frontend/apps/desktop/src-tauri/target/release/bundle/dmg/**
          - os: ubuntu-latest
            bundle: deb
            artifact_path: frontend/apps/desktop/src-tauri/target/release/bundle/deb/**
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install
        run: npm ci

      - name: Rust fmt
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build desktop bundle
        run: npm --workspace @webtui/desktop run tauri -- build --bundles ${{ matrix.bundle }} --ci --no-sign

      - name: Upload native bundle
        uses: actions/upload-artifact@v4
        with:
          name: webtui-desktop-${{ runner.os }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
