name: Mobile

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Mobile release channel"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - beta
          - stable
      build_name:
        description: "Version name passed to Flutter --build-name"
        required: true
        default: "1.0.0"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"
  WEBTUI_API_BASE_URL: "https://chat.vpsttt.com"
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/webtui-chat' }}

jobs:
  validate:
    name: Analyze, test, integration smoke, debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL"
          docker system prune --all --force --volumes || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Flutter SDK
        run: |
          flutter --version
          actual_version="$(flutter --version | sed -n 's/^Flutter \([0-9][0-9.]*\).*/\1/p' | head -n 1)"
          test "$actual_version" = "$FLUTTER_VERSION" || {
            echo "Expected Flutter $FLUTTER_VERSION but found Flutter $actual_version"
            exit 1
          }

      - name: Keep only the Flutter Android NDK
        run: |
          NDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk"
          if [ -d "$NDK_ROOT" ]; then
            find "$NDK_ROOT" -mindepth 1 -maxdepth 1 -type d ! -name '28.2.13676358' -print -exec sudo rm -rf {} +
          fi
          df -h /

      - name: Pub get
        run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed lib test integration_test tool

      - name: Architecture check
        run: dart run tool/check_architecture.dart

      - name: Release readiness check
        run: dart run tool/check_mobile_release.dart

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Integration smoke test on Android emulator
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: cd mobile && flutter test integration_test

      - name: Build debug APK
        run: >
          flutter build apk --debug
          --flavor dev
          -t lib/main_dev.dart
          --dart-define=WEBTUI_API_BASE_URL=${{ env.WEBTUI_API_BASE_URL }}
          --dart-define=WEBTUI_RELEASE_CHANNEL=internal
          --dart-define=WEBTUI_APP_VERSION=1.0.0

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: webtui-chat-dev-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error

  android-release:
    name: Signed Android AAB/APK
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    defaults:
      run:
        working-directory: mobile
    env:
      RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || 'stable' }}
      BUILD_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.build_name || '1.0.0' }}
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      HAS_DOWNLOAD_DEPLOY: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && (secrets.DEPLOY_PASSWORD != '' || secrets.DEPLOY_SSH_KEY != '') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL"
          docker system prune --all --force --volumes || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Flutter SDK
        run: |
          flutter --version
          actual_version="$(flutter --version | sed -n 's/^Flutter \([0-9][0-9.]*\).*/\1/p' | head -n 1)"
          test "$actual_version" = "$FLUTTER_VERSION" || {
            echo "Expected Flutter $FLUTTER_VERSION but found Flutter $actual_version"
            exit 1
          }

      - name: Keep only the Flutter Android NDK
        run: |
          NDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk"
          if [ -d "$NDK_ROOT" ]; then
            find "$NDK_ROOT" -mindepth 1 -maxdepth 1 -type d ! -name '28.2.13676358' -print -exec sudo rm -rf {} +
          fi
          df -h /

      - name: Pub get
        run: flutter pub get

      - name: Signing secrets missing
        if: ${{ env.HAS_ANDROID_SIGNING != 'true' }}
        run: |
          echo "::warning title=Android signing skipped::ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD are required for signed release artifacts."

      - name: Decode Android signing key
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' \
            "storeFile=app/upload-keystore.jks" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > android/key.properties

      - name: Build signed AAB
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        run: >
          flutter build appbundle --release
          --flavor prod
          -t lib/main_prod.dart
          --build-name=${{ env.BUILD_NAME }}
          --build-number=${{ github.run_number }}
          --dart-define=WEBTUI_API_BASE_URL=${{ env.WEBTUI_API_BASE_URL }}
          --dart-define=WEBTUI_RELEASE_CHANNEL=${{ env.RELEASE_CHANNEL }}
          --dart-define=WEBTUI_APP_VERSION=${{ env.BUILD_NAME }}

      - name: Build signed APK
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        run: >
          flutter build apk --release
          --flavor prod
          -t lib/main_prod.dart
          --build-name=${{ env.BUILD_NAME }}
          --build-number=${{ github.run_number }}
          --dart-define=WEBTUI_API_BASE_URL=${{ env.WEBTUI_API_BASE_URL }}
          --dart-define=WEBTUI_RELEASE_CHANNEL=${{ env.RELEASE_CHANNEL }}
          --dart-define=WEBTUI_APP_VERSION=${{ env.BUILD_NAME }}

      - name: Generate checksums and release metadata
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        run: |
          mkdir -p build/release-metadata
          APK_PATH="build/app/outputs/flutter-apk/app-prod-release.apk"
          AAB_PATH="build/app/outputs/bundle/prodRelease/app-prod-release.aab"
          APK_SHA256="$(sha256sum "$APK_PATH" | cut -d ' ' -f 1)"
          AAB_SHA256="$(sha256sum "$AAB_PATH" | cut -d ' ' -f 1)"
          printf '%s  app-prod-release.apk\n' "$APK_SHA256" > build/release-metadata/app-prod-release.apk.sha256
          printf '%s  app-prod-release.aab\n' "$AAB_SHA256" > build/release-metadata/app-prod-release.aab.sha256
          cat > build/release-metadata/mobile-release-manifest.json <<JSON
          {
            "platform": "android",
            "package_name": "com.vpsttt.webtui_chat",
            "channel": "${RELEASE_CHANNEL}",
            "current_version": "${BUILD_NAME}",
            "latest_version": "${BUILD_NAME}",
            "version": "${BUILD_NAME}",
            "version_code": ${GITHUB_RUN_NUMBER},
            "minimum_version": "${BUILD_NAME}",
            "recommended_version": "${BUILD_NAME}",
            "apk_file": "app-prod-release.apk",
            "aab_file": "app-prod-release.aab",
            "download_url": "https://chat.vpsttt.com/downloads/files/android/${RELEASE_CHANNEL}/app-prod-release.apk",
            "store_url": "",
            "checksum_sha256": "${APK_SHA256}",
            "aab_checksum_sha256": "${AAB_SHA256}",
            "release_notes": "Internal Android release generated by GitHub Actions."
          }
          JSON
          cp build/release-metadata/mobile-release-manifest.json build/release-metadata/latest.json
          cat > build/release-metadata/download-manifest.json <<JSON
          {
            "channel": "${RELEASE_CHANNEL}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "files": [
              {
                "name": "app-prod-release.apk",
                "platform": "android",
                "version": "${BUILD_NAME}",
                "version_code": ${GITHUB_RUN_NUMBER},
                "url": "https://chat.vpsttt.com/downloads/files/android/${RELEASE_CHANNEL}/app-prod-release.apk",
                "checksum_sha256": "${APK_SHA256}"
              },
              {
                "name": "app-prod-release.aab",
                "platform": "android",
                "version": "${BUILD_NAME}",
                "version_code": ${GITHUB_RUN_NUMBER},
                "url": "release-manager-only",
                "checksum_sha256": "${AAB_SHA256}"
              }
            ]
          }
          JSON

      - name: Upload signed Android artifacts
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: webtui-chat-android-${{ env.RELEASE_CHANNEL }}-${{ env.BUILD_NAME }}-${{ github.run_number }}
          path: |
            mobile/build/app/outputs/flutter-apk/app-prod-release.apk
            mobile/build/app/outputs/bundle/prodRelease/app-prod-release.aab
            mobile/build/release-metadata/*
          if-no-files-found: error

      - name: Download deploy secrets missing
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' && env.HAS_DOWNLOAD_DEPLOY != 'true' }}
        run: |
          echo "::warning title=Download publish skipped::DEPLOY_HOST, DEPLOY_USER and DEPLOY_PASSWORD or DEPLOY_SSH_KEY are required to publish APK to chat.vpsttt.com/download/."

      - name: Stage download host files
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' && env.HAS_DOWNLOAD_DEPLOY == 'true' }}
        run: |
          mkdir -p build/download
          cp -R ../deploy/download/. build/download/
          mkdir -p "build/download/android/${RELEASE_CHANNEL}"
          cp build/app/outputs/flutter-apk/app-prod-release.apk "build/download/android/${RELEASE_CHANNEL}/app-prod-release.apk"
          cp build/release-metadata/app-prod-release.apk.sha256 "build/download/android/${RELEASE_CHANNEL}/app-prod-release.apk.sha256"
          cp build/release-metadata/mobile-release-manifest.json "build/download/android/${RELEASE_CHANNEL}/mobile-release-manifest.json"
          cp build/release-metadata/latest.json "build/download/android/${RELEASE_CHANNEL}/latest.json"
          cp build/release-metadata/download-manifest.json "build/download/android/${RELEASE_CHANNEL}/download-manifest.json"

      - name: Create download directory on VPS
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' && env.HAS_DOWNLOAD_DEPLOY == 'true' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p "${{ env.DEPLOY_PATH }}/data/downloads"

      - name: Publish APK to download host
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' && env.HAS_DOWNLOAD_DEPLOY == 'true' }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "mobile/build/download/*"
          target: ${{ env.DEPLOY_PATH }}/data/downloads
          strip_components: 3
          overwrite: true

      - name: Verify public APK URL
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' && env.HAS_DOWNLOAD_DEPLOY == 'true' }}
        run: |
          curl -fsSI "https://chat.vpsttt.com/downloads/files/android/${RELEASE_CHANNEL}/app-prod-release.apk"
